[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)s -ac
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

[program:xfce4]
priority=20
user=antigravity
directory=/home/antigravity
environment=DISPLAY=":1",HOME="/home/antigravity",USER="antigravity",SHELL="/bin/bash"
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
autorestart=true
stdout_logfile=/var/log/supervisor/xfce4.log
stderr_logfile=/var/log/supervisor/xfce4.log

[program:x11vnc]
priority=30
command=/bin/bash -c "sleep 2 && exec /usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 %(ENV_X11VNC_AUTH)s"
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

[program:websockify]
priority=40
command=/bin/bash -c "sleep 3 && exec /usr/bin/websockify --web=/usr/share/novnc 8080 localhost:5900"
autorestart=true
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.log

[program:sshd]
priority=50
command=/usr/sbin/sshd -D
autorestart=true
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.log

[program:antigravity-remote]
priority=60
user=antigravity
directory=/workspace
environment=HOME="/home/antigravity",USER="antigravity",DISPLAY=":1",PATH="/usr/local/bin:/usr/bin:/bin"
command=/opt/scripts/run-antigravity-remote.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/antigravity-remote.log
stderr_logfile=/var/log/supervisor/antigravity-remote.log

